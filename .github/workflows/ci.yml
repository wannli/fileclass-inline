name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate, test, and build
        run: npm run check
      - name: Upload the checked plugin
        uses: actions/upload-artifact@v7
        with:
          name: obsidian-nodes-plugin
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/main.js
            dist/manifest.json
